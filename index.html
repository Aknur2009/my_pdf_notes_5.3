<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><meta name="theme-color" content="#7355c5"><title>My PDF Notes</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,Arial;background:#eeebf5;color:#28213d}button,input,textarea{font:inherit}button{border:0;cursor:pointer;border-radius:12px;padding:10px;background:#f0eafa;color:#49347e}button:active{transform:scale(.97)}button.active,.primary{background:#7655c7;color:white}.bar{display:flex;align-items:center;gap:8px;padding:9px;background:white;box-shadow:0 1px 6px #0001}.bar strong{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tools{overflow-x:auto;white-space:nowrap;scrollbar-width:none}.tools button{min-width:42px}.wrap{max-width:1100px;margin:auto;padding:18px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.card{background:white;padding:20px;border-radius:16px;min-height:155px;display:flex;flex-direction:column;align-items:start;gap:12px;overflow-wrap:anywhere}.card b{flex:1}.muted{color:#746b87;font-size:13px}.reader{display:none}.reader.open{display:block}.library.hidden{display:none}#viewport{height:calc(100dvh - 153px);overflow:auto;overscroll-behavior:contain;background:#dedbe7;touch-action:pan-x pan-y}#pages{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 12px 40px;min-width:max-content}.page{position:relative;background:white;box-shadow:0 2px 8px #0002;flex:none}.page canvas{display:block}.ink{position:absolute;inset:0;pointer-events:none}.page .placeholder{display:flex;align-items:center;justify-content:center;color:#999;height:100%;font-size:13px}.bottom{height:51px;justify-content:space-between}.bottom button{padding:8px 12px}.overlay{display:none;position:fixed;inset:0;background:#0007;z-index:20;align-items:center;justify-content:center}.overlay.open{display:flex}.dialog{background:white;border-radius:18px;padding:20px;width:min(94vw,460px);max-height:85dvh;overflow:auto}.dialog textarea{width:100%;height:200px;border:1px solid #ccc;border-radius:10px;padding:10px}.toast{position:fixed;bottom:65px;left:50%;transform:translateX(-50%);background:#292039;color:white;padding:12px 18px;border-radius:12px;z-index:30;display:none;max-width:90vw}.color{height:29px;min-width:29px!important;width:29px;border-radius:50%;padding:0!important;border:2px solid #eee}.color.active{outline:2px solid #7655c7;outline-offset:2px}#status{font-size:12px;color:#776c8a}#busy{display:none;padding:10px;background:#fff3c9;text-align:center}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.danger{color:#b72f50}a{color:#6346b1}@media(max-width:540px){.wrap{padding:12px}.bar{gap:4px;padding:7px}.bar button{padding:9px}#viewport{height:calc(100dvh - 145px)}}
</style></head><body>
<div id="busy" role="status">PDF ашылып жатыр...</div><header class="bar"><button id="home" title="Кітапхана">📚</button><strong id="title">My PDF Notes 5.0</strong><span id="status">Дайын</span><button id="backup" title="Көшірме">⇅</button></header>
<section class="library" id="library"><div class="wrap"><div class="row" style="justify-content:space-between"><h2>💜 Менің кітаптарым</h2><button class="primary" id="add">+ PDF қосу</button></div><p class="muted">Кітаптар мен белгілер осы браузерде сақталады. Маңызды кітаптар үшін резервтік көшірме жаса.</p><div class="cards" id="cards"></div><p id="empty">Әзірге кітап жоқ. PDF қосып баста.</p></div></section>
<section class="reader" id="reader"><div class="bar tools" id="toolbar"><button data-tool="hand" class="active" title="Оқу және жылжыту">✋</button><button data-tool="pen" title="Қалам">✏️</button><button data-tool="marker" title="Маркер">🖍️</button><button data-tool="erase" title="Өшіргіш">⌫</button><button data-tool="text" title="Мәтін">T</button><button class="color active" data-color="#272137" style="background:#272137" title="Қара"></button><button class="color" data-color="#ed4b7b" style="background:#ed4b7b" title="Қызғылт"></button><button class="color" data-color="#ffd740" style="background:#ffd740" title="Сары"></button><button class="color" data-color="#329bdb" style="background:#329bdb" title="Көк"></button><button id="undo" title="Соңғы белгіні қайтару">↶</button><button id="notes" title="Заметкалар">📝</button><button id="export" title="PDF экспорт">⇩</button></div><main id="viewport"><div id="pages"></div></main><footer class="bar bottom"><span id="counter">1 / 1</span><div class="row"><button id="minus">−</button><span id="scale">100%</span><button id="plus">+</button><button id="fit">Сыйдыру</button></div></footer></section>
<input type="file" id="file" accept=".pdf,application/pdf" hidden><input type="file" id="restoreFile" accept=".json" hidden>
<div class="overlay" id="modal"><div class="dialog"><div class="row" style="justify-content:space-between"><h3 id="modalTitle">Заметкалар</h3><button id="close">✕</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);let db=null,book=null,pdf=null,tool='hand',color='#272137',zoom=1,base=1,marks={},notes='',saveTimer=null,token=0,observer=null,visible=new Map(),activePage=1,rendering=new Set(),pinch=null;
const notify=s=>{const e=$('toast');e.textContent=s;e.style.display='block';clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>e.style.display='none',4500)};
const busy=(v,msg='PDF ашылып жатыр...')=>{$('busy').textContent=msg;$('busy').style.display=v?'block':'none'};
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open('pdf-notes-5',1);r.onupgradeneeded=()=>{r.result.createObjectStore('books',{keyPath:'id'});r.result.createObjectStore('marks',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function request(store,method,...args){return new Promise((ok,no)=>{const t=db.transaction(store,method==='get'||method==='getAll'?'readonly':'readwrite');const r=t.objectStore(store)[method](...args);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);t.onerror=()=>no(t.error)})}
const hash=async bytes=>{const h=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(h)].map(v=>v.toString(16).padStart(2,'0')).join('')};
function checkPDF(){if(!window.pdfjsLib)throw Error('PDF кітапханасы жүктелмеді. Интернетті тексеріп, бетті жаңарт.');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
async function showLibrary(){await saveNow();token++;if(observer)observer.disconnect();observer=null;visible.clear();rendering.clear();pdf=null;book=null;$('reader').classList.remove('open');$('library').classList.remove('hidden');$('title').textContent='My PDF Notes 5.0';$('status').textContent='Дайын';const books=await request('books','getAll');books.sort((a,b)=>(b.updated||0)-(a.updated||0));$('cards').replaceChildren();$('empty').hidden=books.length>0;for(const b of books){const c=document.createElement('div');c.className='card';const icon=document.createElement('div');icon.textContent='📖';icon.style.fontSize='34px';const name=document.createElement('b');name.textContent=b.name;const small=document.createElement('span');small.className='muted';small.textContent=(b.pages||'?')+' бет';const actions=document.createElement('div');actions.className='row';const open=document.createElement('button');open.textContent='Оқу';open.className='primary';open.onclick=()=>openBook(b.id);const remove=document.createElement('button');remove.textContent='Жою';remove.className='danger';remove.onclick=async()=>{if(!confirm('Кітап пен барлық белгілерді өшіреміз бе?'))return;await request('books','delete',b.id);await request('marks','delete',b.id);await showLibrary()};actions.append(open,remove);c.append(icon,name,small,actions);$('cards').append(c)}}
async function importFile(f){if(!f)return;busy(true,'PDF импортталуда...');try{checkPDF();const bytes=await f.arrayBuffer();const id=await hash(bytes);const existing=await request('books','get',id);if(existing){busy(false);await openBook(id);return}const doc=await pdfjsLib.getDocument({data:new Uint8Array(bytes.slice(0))}).promise;const b={id,name:f.name,bytes,pages:doc.numPages,updated:Date.now(),lastPage:1};await request('books','put',b);await request('marks','put',{id,pages:{},notes:''});doc.destroy();busy(false);await openBook(id)}catch(e){busy(false);console.error(e);notify('PDF ашылмады: '+e.message)}}
async function openBook(id){busy(true);try{checkPDF();await saveNow();token++;if(observer)observer.disconnect();visible.clear();rendering.clear();book=await request('books','get',id);if(!book)throw Error('Кітап табылмады');const record=await request('marks','get',id);marks=record?.pages||{};notes=record?.notes||'';pdf=await pdfjsLib.getDocument({data:new Uint8Array(book.bytes.slice(0))}).promise;zoom=1;$('pages').style.zoom='1';activePage=book.lastPage||1;$('title').textContent=book.name;$('library').classList.add('hidden');$('reader').classList.add('open');$('viewport').scrollTop=0;await buildPages();busy(false)}catch(e){busy(false);console.error(e);notify('Кітап ашылмады: '+e.message)}}
async function buildPages(){const my=++token;visible.clear();rendering.clear();if(observer)observer.disconnect();const first=await pdf.getPage(1),v=first.getViewport({scale:1});base=Math.min(1.5,(Math.max(280,$('viewport').clientWidth-24))/v.width);const root=$('pages');root.replaceChildren();const fragment=document.createDocumentFragment();for(let n=1;n<=pdf.numPages;n++){const p=document.createElement('div');p.className='page';p.dataset.n=n;p.style.width=Math.ceil(v.width*base)+'px';p.style.height=Math.ceil(v.height*base)+'px';p.innerHTML='<div class="placeholder">'+n+' / '+pdf.numPages+'</div>';fragment.append(p)}root.append(fragment);$('scale').textContent=Math.round(zoom*100)+'%';$('counter').textContent=activePage+' / '+pdf.numPages;observer=new IntersectionObserver(entries=>{if(my!==token)return;for(const e of entries){const n=Number(e.target.dataset.n);if(e.isIntersecting){activePage=n;renderPage(n,my)}else{const old=visible.get(n);if(old&&!rendering.has(n)){old.pdf.width=0;old.ink.width=0;visible.delete(n);e.target.innerHTML='<div class="placeholder">'+n+' / '+pdf.numPages+'</div>'}}} $('counter').textContent=activePage+' / '+pdf.numPages;queueProgress()},{root:$('viewport'),rootMargin:'600px 0px'});for(const el of root.children)observer.observe(el);const target=root.children[Math.min(pdf.numPages,activePage)-1];if(target)$('viewport').scrollTop=target.offsetTop-root.offsetTop}
async function renderPage(n,my){if(visible.has(n)||rendering.has(n)||my!==token)return;rendering.add(n);try{const page=await pdf.getPage(n);if(my!==token)return;const native=page.getViewport({scale:1});const standardWidth=(await pdf.getPage(1)).getViewport({scale:1}).width*base;const view=page.getViewport({scale:standardWidth/native.width});const ratio=Math.min(devicePixelRatio||1,1.5);const p=$('pages').children[n-1];if(!p)return;p.style.width=Math.ceil(view.width)+'px';p.style.height=Math.ceil(view.height)+'px';const canvas=document.createElement('canvas');canvas.width=Math.floor(view.width*ratio);canvas.height=Math.floor(view.height*ratio);canvas.style.width=view.width+'px';canvas.style.height=view.height+'px';const ink=document.createElement('canvas');ink.className='ink';ink.width=canvas.width;ink.height=canvas.height;ink.style.width=canvas.style.width;ink.style.height=canvas.style.height;p.replaceChildren(canvas,ink);visible.set(n,{pdf:canvas,ink,scale:standardWidth/native.width,ratio});setInkMode(ink);attachInk(ink,n);await page.render({canvasContext:canvas.getContext('2d',{alpha:false}),viewport:view,transform:[ratio,0,0,ratio,0,0]}).promise;if(my===token)drawMarks(n)}catch(e){console.error('Page '+n,e);notify('Бетті көрсету қатесі: '+e.message)}finally{rendering.delete(n)}}
function drawMarks(n,draft){const obj=visible.get(n);if(!obj)return;const {ink,scale,ratio}=obj,ctx=ink.getContext('2d');ctx.clearRect(0,0,ink.width,ink.height);ctx.save();ctx.scale(scale*ratio,scale*ratio);for(const m of [...(marks[n]||[]),...(draft?[draft]:[])]){ctx.globalAlpha=m.type==='marker'?.34:1;ctx.lineWidth=m.width||2.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=m.color;ctx.fillStyle=m.color;if(m.type==='text'){ctx.globalAlpha=1;ctx.font='18px system-ui';ctx.fillText(m.text,m.x,m.y);continue}const pts=m.points||[];if(!pts.length)continue;ctx.beginPath();ctx.moveTo(...pts[0]);for(const pt of pts.slice(1))ctx.lineTo(...pt);if(pts.length===1)ctx.lineTo(pts[0][0]+.1,pts[0][1]+.1);ctx.stroke()}ctx.restore()}
function xy(e,ink,n){const r=ink.getBoundingClientRect(),scale=visible.get(n).scale*zoom;return [(e.clientX-r.left)/scale,(e.clientY-r.top)/scale]}
function attachInk(ink,n){let drawing=null;ink.onpointerdown=e=>{if(tool==='hand'||(e.pointerType==='touch'&&!e.isPrimary))return;const [x,y]=xy(e,ink,n);if(tool==='text'){const text=prompt('Мәтін жаз:');if(text?.trim()){(marks[n]??=[]).push({type:'text',x,y,text:text.trim(),color});drawMarks(n);queueSave()}return}if(tool==='erase'){const arr=marks[n]||[];let idx=-1,dist=25;arr.forEach((m,i)=>{const pts=m.type==='text'?[[m.x,m.y]]:m.points||[];for(const p of pts){const d=Math.hypot(p[0]-x,p[1]-y);if(d<dist){dist=d;idx=i}}});if(idx>=0){arr.splice(idx,1);drawMarks(n);queueSave()}return}drawing={type:tool,color:tool==='marker'&&color==='#272137'?'#ffd740':color,width:tool==='marker'?20:2.5,points:[[x,y]]};ink.setPointerCapture(e.pointerId);e.preventDefault()};ink.onpointermove=e=>{if(!drawing)return;drawing.points.push(xy(e,ink,n));drawMarks(n,drawing);e.preventDefault()};const finish=e=>{if(!drawing)return;(marks[n]??=[]).push(drawing);drawing=null;drawMarks(n);queueSave()};ink.onpointerup=finish;ink.onpointercancel=finish}
function setInkMode(ink){ink.style.pointerEvents=tool==='hand'?'none':'auto';ink.style.touchAction=tool==='hand'?'auto':'none'}function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));for(const r of visible.values())setInkMode(r.ink)}
function queueSave(){if(!book)return;$('status').textContent='Сақталуда';clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,500)}async function saveNow(){clearTimeout(saveTimer);if(!book||!db)return;try{await request('marks','put',{id:book.id,pages:marks,notes});$('status').textContent='✓ Сақталды'}catch(e){console.error(e);$('status').textContent='⚠ Қате';notify('Сақтау қатесі: '+e.message)}}let progressTimer;function queueProgress(){if(!book)return;clearTimeout(progressTimer);progressTimer=setTimeout(async()=>{if(!book)return;book.lastPage=activePage;book.updated=Date.now();try{await request('books','put',book)}catch(e){console.error(e)}},1100)}
// Stable zoom: scale existing PDF canvases without destroying/recreating them.
// This prevents blank/black pages on Android during pinch zoom.
function zoomTo(z){
  if(!pdf)return;
  const next=Math.max(.6,Math.min(2.5,z));
  if(Math.abs(next-zoom)<.005)return;
  const vp=$('viewport'),layer=$('pages');
  const ratio=next/zoom;
  const centerX=vp.scrollLeft+vp.clientWidth/2;
  const centerY=vp.scrollTop+vp.clientHeight/2;
  zoom=next;
  layer.style.zoom=String(zoom);
  vp.scrollLeft=Math.max(0,centerX*ratio-vp.clientWidth/2);
  vp.scrollTop=Math.max(0,centerY*ratio-vp.clientHeight/2);
  $('scale').textContent=Math.round(zoom*100)+'%';
}
function modal(title,node){$('modalTitle').textContent=title;$('modalBody').replaceChildren(node);$('modal').classList.add('open')}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
async function backup(){await saveNow();const books=await request('books','getAll'),records=await request('marks','getAll');const payload=[];for(const b of books){const bytes=new Uint8Array(b.bytes);let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.subarray(i,i+8192));payload.push({...b,bytes:btoa(s)})}download(new Blob([JSON.stringify({version:5,books:payload,records})],{type:'application/json'}),'my-pdf-notes-backup.json')}
async function restore(f){try{const data=JSON.parse(await f.text());if(data.version!==5||!Array.isArray(data.books)||!Array.isArray(data.records))throw Error('Қате файл');for(const b of data.books){const raw=atob(b.bytes),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);await request('books','put',{...b,bytes:bytes.buffer})}for(const r of data.records)await request('marks','put',r);$('modal').classList.remove('open');await showLibrary();notify('Көшірме қалпына келді')}catch(e){notify('Қалпына келмеді: '+e.message)}}
async function exportPDF(){if(!book)return;busy(true,'PDF экспортталуда...');try{const lib=await import('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/+esm');const out=await lib.PDFDocument.load(book.bytes);const pages=out.getPages();for(const [key,items] of Object.entries(marks)){const page=pages[Number(key)-1];if(!page)continue;const {width:W,height:H}=page.getSize();const original=await pdf.getPage(Number(key));const v=original.getViewport({scale:1});const sx=W/v.width,sy=H/v.height;for(const m of items){const hex=m.color.slice(1),c=lib.rgb(parseInt(hex.slice(0,2),16)/255,parseInt(hex.slice(2,4),16)/255,parseInt(hex.slice(4,6),16)/255);if(m.type==='text'){const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');ctx.font='18px Arial';canvas.width=Math.max(10,Math.ceil(ctx.measureText(m.text).width)+8);canvas.height=30;ctx.font='18px Arial';ctx.fillStyle=m.color;ctx.fillText(m.text,2,20);const png=await out.embedPng(canvas.toDataURL('image/png'));page.drawImage(png,{x:m.x*sx,y:H-m.y*sy-25*sy,width:canvas.width*sx,height:canvas.height*sy});continue}const pts=m.points||[];for(let i=1;i<pts.length;i++)page.drawLine({start:{x:pts[i-1][0]*sx,y:H-pts[i-1][1]*sy},end:{x:pts[i][0]*sx,y:H-pts[i][1]*sy},thickness:m.width*sx,color:c,opacity:m.type==='marker'?.34:1})}}download(new Blob([await out.save()],{type:'application/pdf'}),book.name.replace(/\.pdf$/i,'')+'-notes.pdf');notify('PDF экспортталды')}catch(e){console.error(e);notify('Экспорт қатесі: '+e.message)}finally{busy(false)}}
$('add').onclick=()=>$('file').click();$('file').onchange=e=>{importFile(e.target.files[0]);e.target.value=''};$('home').onclick=()=>{showLibrary().catch(e=>notify(e.message))};document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;document.querySelectorAll('[data-color]').forEach(c=>c.classList.toggle('active',c===b))});$('plus').onclick=()=>zoomTo(zoom*1.2);$('minus').onclick=()=>zoomTo(zoom/1.2);$('fit').onclick=()=>zoomTo(1);$('undo').onclick=()=>{const a=marks[activePage];if(a?.length){a.pop();drawMarks(activePage);queueSave()}else notify('Бұл бетте белгі жоқ')};$('notes').onclick=()=>{const t=document.createElement('textarea');t.value=notes;t.placeholder='Конспект жаз...';t.oninput=()=>{notes=t.value;queueSave()};modal('📝 Заметкалар',t)};$('close').onclick=()=>$('modal').classList.remove('open');$('backup').onclick=()=>{const div=document.createElement('div');div.innerHTML='<p>Кітаптар мен белгілерді сақтап қой. Көшірме файлы үлкен болуы мүмкін.</p>';const save=document.createElement('button');save.className='primary';save.textContent='Көшірме жүктеу';save.onclick=()=>backup().catch(e=>notify(e.message));const restoreBtn=document.createElement('button');restoreBtn.textContent='Көшірмені ашу';restoreBtn.onclick=()=>$('restoreFile').click();div.append(save,restoreBtn);modal('📦 Резервтік көшірме',div)};$('restoreFile').onchange=e=>{if(e.target.files[0])restore(e.target.files[0]);e.target.value=''};$('export').onclick=exportPDF;
const vp=$('viewport'),pageLayer=$('pages');
const touchDistance=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
vp.addEventListener('touchstart',e=>{
  if(e.touches.length===2&&pdf){
    pinch={distance:Math.max(1,touchDistance(e)),zoom};
  }
},{passive:true});
vp.addEventListener('touchmove',e=>{
  if(!pinch||e.touches.length!==2)return;
  e.preventDefault();
  zoomTo(pinch.zoom*touchDistance(e)/pinch.distance);
},{passive:false});
function endPinch(e){if(pinch&&e.touches.length<2)pinch=null}
vp.addEventListener('touchend',endPinch,{passive:true});
vp.addEventListener('touchcancel',endPinch,{passive:true});
vp.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();zoomTo(zoom*(e.deltaY>0?.9:1.1))}},{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});
(async()=>{try{db=await openDB();await showLibrary();if(!window.pdfjsLib)notify('PDF.js жүктелмеді. Интернетті тексер.')}catch(e){console.error(e);notify('Браузер сақтау қатесі: '+e.message)}})();
</script></body></html>
